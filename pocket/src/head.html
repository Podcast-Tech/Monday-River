<title>River Pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one thumb-first column. Sticky header (bell) → the river as one tappable strip of stages → three "pressing" counters →
   search → the task list, most urgent first. A task opens as a full-screen sheet from the bottom; so do the inbox and Add task.
   Dark-only, like River. */
:root{
  color-scheme:dark;
  --night:#05080D; --card:#0B111A; --raise:#111925; --hover:#162030; --line:rgb(160 200 255 / .09); --line-2:rgb(160 200 255 / .17);
  --ink:#EEF3FA; --ink-2:#C9D3E2; --muted:#8693A8; --faint:#55617A;
  --water:#3FA9FF; --foam:#BFE3FF; --sea:#9C8CFF;
  --brand:#FF003C; --late:#FF5C76; --today:#F6B64A; --ok:#3EDC97;
  --st-queue:#8693A8; --st-assigned:#C9D3E2; --st-process:#F6C94A; --st-review:#5EB2FF; --st-corr:#FF8F45; --st-client:#3EDC97; --st-done:#9C8CFF; --st-other:#A68CFF;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);background-image:radial-gradient(900px 420px at 50% -120px,#0E1C30 0%,transparent 70%);color:var(--ink);font:400 15px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 120px;display:grid;gap:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;margin-inline:-16px;padding:12px 16px 10px;background:linear-gradient(180deg,var(--night) 70%,rgb(5 8 13 / 0))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--muted)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync.stale{background:var(--today)} .sync.off{background:var(--late)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-2);background:var(--card)}
.icon-btn:active{background:var(--hover)}
.icon-btn b{position:absolute;top:-3px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font:600 11px/19px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--night)}

/* the river strip */
.river{display:grid;gap:8px}
.strip{display:flex;gap:3px;height:58px;border-radius:16px;overflow:hidden;position:relative}
.seg{position:relative;flex:var(--n) 1 0;min-width:44px;display:grid;align-content:center;justify-items:center;gap:1px;background:color-mix(in srgb,var(--c) 18%,#0B111A);color:var(--ink);overflow:hidden}
.seg::before{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--c);opacity:.9}
.seg b{font:600 17px/1 var(--f);letter-spacing:-.02em}
.seg i{font-style:normal;font-size:10px;color:var(--ink-2);opacity:.75;white-space:nowrap}
.seg em{position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--late);color:#fff;font:600 9px/14px var(--mono);font-style:normal}
.seg[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 34%,#0B111A);box-shadow:inset 0 0 0 2px var(--c)}
.seg.sea{flex:0 0 50px;background:linear-gradient(90deg,#141433,#1D1A45)}
.seg.sea::before{background:var(--sea)}
.seg.sea b{color:var(--sea)}
@media (prefers-reduced-motion:no-preference){.strip::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 20%,rgb(191 227 255 / .07) 40%,transparent 60%);background-size:260% 100%;animation:flow 6s linear infinite}@keyframes flow{from{background-position:130% 0}to{background-position:-130% 0}}}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* pressing counters */
.press{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px}
.pc b{font:600 24px/1.1 var(--f);letter-spacing:-.03em}
.pc span{font-size:12px;color:var(--muted)}
.pc.late b{color:var(--late)} .pc.today b{color:var(--today)} .pc.cr b{color:var(--st-client)}
.pc[aria-pressed="true"]{border-color:var(--ink);background:var(--raise)}

/* search + filters */
.find{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:999px;padding:10px 14px;background:var(--card);color:var(--muted);box-shadow:0 8px 20px -10px #000}
.find:focus-within{border-color:rgb(255 0 60 / .6)}
.find input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:var(--ink);font-size:16px}
.find input::placeholder{color:var(--faint)}
.find .x{font-size:20px;line-height:1;color:var(--muted);padding:0 2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink);font-weight:500}

/* list */
.group{display:grid;gap:6px}
.group h3{margin:6px 2px 2px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px}
.group h3 em{font-style:normal;color:var(--faint);font-family:var(--mono)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;min-height:60px}
.row:active{background:var(--hover)}
.row.late{border-color:rgb(255 92 118 / .35)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f);color:#05080D;background:var(--c);position:relative}
.row.late .av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--late);opacity:.7}
@media (prefers-reduced-motion:no-preference){.row.late .av::after{animation:pulse 2.2s ease-out infinite}@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}}
.row .nm{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .nm mark{background:rgb(255 0 60 / .28);color:#fff;border-radius:3px}
.row .meta{display:flex;gap:6px;align-items:baseline;font-size:12.5px;color:var(--muted);margin-top:2px;min-width:0}
.row .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .meta em{font-style:normal;margin-left:auto;white-space:nowrap;color:var(--ink-2)}
.late-t{color:var(--late)!important} .today-t{color:var(--today)!important}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.banner{border:1px solid rgb(255 92 118 / .4);background:rgb(255 92 118 / .08);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.banner span{color:var(--muted);font-size:14px}
.skel{display:grid;gap:8px}.skel i{display:block;height:60px;border-radius:14px;background:linear-gradient(90deg,#0B111A,#131C29,#0B111A);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel i{animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}}

/* add button */
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 304px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--brand);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px -10px rgb(255 0 60 / .55),0 6px 16px -6px #000}
.fab:active{background:#E00035}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--night);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh-h .back{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 10px 0 4px;border-radius:10px;color:var(--ink-2);font-weight:500}
.sh-h .back:active{background:var(--hover)}
.sh-h span{flex:1;min-width:0;font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h a,.sh-h .ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.sh-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px calc(env(safe-area-inset-bottom,0px) + 40px);display:grid;gap:20px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;border-radius:999px;padding:3px 11px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 13%,transparent);justify-self:start}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip{font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.rel{margin:-12px 0 0;font-size:15px;color:var(--ink-2)}
.props{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;margin:0;font-size:15px}
.props dt{color:var(--muted)} .props dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.dates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.dates div{display:grid;gap:2px;padding:9px 6px;text-align:center;border-left:1px solid var(--line)}
.dates div:first-child{border-left:0}
.dates span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dates b{font:600 14px var(--f);white-space:nowrap}
.dates .empty-d b{color:var(--faint);font-weight:400}
.dates .due{background:rgb(255 255 255 / .05)} .dates .due.late{background:rgb(255 92 118 / .14)} .dates .due.today{background:rgb(246 182 74 / .12)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.lk{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line-2);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:500;color:var(--foam);text-decoration:none;text-align:center}
.lk:active{background:var(--hover)}
.lbl{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl a,.lbl button{text-transform:none;letter-spacing:0;font-weight:500;color:var(--foam);text-decoration:none;font-size:13px}
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mv{display:flex;align-items:center;gap:9px;min-height:50px;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500;text-align:left;background:var(--card)}
.mv i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.mv:active:not([disabled]){background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.mv[disabled]{opacity:.35}
.mv.cur{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.composer{border:1px solid var(--line-2);border-radius:14px;background:var(--card)}
.composer:focus-within{border-color:rgb(190 225 255 / .35)}
.composer textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:vertical;min-height:104px;padding:12px 14px;line-height:1.5;font-size:16px}
.composer textarea::placeholder{color:var(--faint)}
.c-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 10px 10px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.c-bar label{display:inline-flex;gap:7px;align-items:center}
.c-bar input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.post{margin-left:auto;min-height:42px;background:var(--brand);color:#fff;border-radius:11px;padding:0 18px;font-weight:600}
.post:active{background:#E00035} .post[disabled]{opacity:.5}
.btn{min-height:42px;border:1px solid var(--line-2);border-radius:11px;padding:0 16px;font-weight:500;color:var(--ink-2)}
.pkg{border:1px solid var(--line-2);border-radius:14px;padding:14px;display:grid;gap:10px;background:rgb(63 169 255 / .045)}
.pkg .lbl{margin:0}
.pkg .muted{margin:0;color:var(--muted);font-size:14px}
.pkg .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;color:var(--sea);margin-left:6px}
.ups{display:grid;gap:12px}
.up{border-left:2px solid var(--line-2);padding:1px 0 1px 12px;font-size:14px}
.up b{font-weight:600} .up small{margin-left:6px;color:var(--faint);font:400 12px var(--mono)}
.up p{margin:3px 0 0;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.lock{display:grid;gap:10px;border:1px dashed var(--line-2);border-radius:14px;padding:14px;color:var(--muted)}
.lock .btn{justify-self:start}

/* inbox */
.nf{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.nf.new{border-color:rgb(255 0 60 / .4);background:rgb(255 0 60 / .05)}
.nf .av{color:#fff;background:var(--c)}
.nf .av.auto{background:#24304A;color:var(--muted)}
.nf-top{display:flex;gap:6px;align-items:baseline;font-size:14px;min-width:0}
.nf-top b{font-weight:600;white-space:nowrap}
.nf-top span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.nf-top small{font:400 12px var(--mono);color:var(--faint)}
.nf p{margin:4px 0 0;font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nf-ep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;font-size:13px}
.nf-ep button.ep,.nf-ep a{color:var(--foam);font-weight:500;text-decoration:none;text-align:left}
.nf-ep .rp{margin-left:auto;min-height:36px;border:1px solid var(--line-2);border-radius:10px;padding:0 13px;color:var(--ink-2)}
.nf .composer{margin-top:10px}

/* add task */
.form{display:grid;gap:16px}
.fld{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.fld input,.fld select{width:100%;min-height:48px;border:1px solid var(--line-2);border-radius:12px;background:var(--card);padding:10px 12px;color:var(--ink);outline:0;font-size:16px}
.fld input:focus,.fld select:focus{border-color:rgb(255 0 60 / .6)}
.fld select option{background:#0B111A}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds button{min-height:40px;border:1px solid var(--line-2);border-radius:999px;padding:0 15px;font-size:14px;color:var(--muted)}
.kinds button[aria-pressed="true"]{border-color:var(--water);color:var(--ink);background:rgb(63 169 255 / .14)}
.sum{border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2);display:grid;gap:5px}
.sum b{color:var(--ink);font-weight:500}
.picks{display:grid;gap:4px;margin-top:-8px}
.picks button{text-align:left;min-height:42px;border-radius:10px;padding:8px 12px;border:1px solid var(--line);background:var(--card);font-size:15px}
.picks button small{color:var(--muted);margin-left:6px;font-size:12px}

.toast{position:fixed;z-index:30;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--night);padding:12px 12px 12px 16px;border-radius:14px;font-size:14px;box-shadow:0 16px 40px -12px #000}
.toast button{color:var(--night);font-weight:600;min-height:34px;padding:0 12px;border-radius:9px;background:rgb(0 0 0 / .1)}
.toast span{flex:1}
.toast.bad{background:var(--late);color:#fff} .toast.bad button{color:#fff;background:rgb(255 255 255 / .2)}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#FF003C"/><rect x="12" y="8" width="16" height="18" rx="8" fill="none" stroke="#fff" stroke-width="3.6"/><path d="M13.8 22v11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>
      <div><b>River</b><span id="sub">Your episodes</span></div>
    </div>
    <i class="sync" id="sync" title="Sync status"></i>
    <button class="icon-btn" id="refresh" type="button" aria-label="Sync now" title="Sync now"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    <button class="icon-btn" id="bell" type="button" aria-label="Monday notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><b id="bell-n" hidden></b></button>
  </header>
  <section class="river" id="river" aria-label="Your river by stage"></section>
  <section class="press" id="press" aria-label="What needs you"></section>
  <label class="find"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Client, editor or stage" autocomplete="off" enterkeyhint="search" aria-label="Search your tasks"><button class="x" id="qx" type="button" aria-label="Clear search" hidden>×</button></label>
  <div class="chips" id="chips" role="group" aria-label="Show"></div>
  <section id="list" aria-live="polite"></section>
</div>
<button class="fab" id="add" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"></div>

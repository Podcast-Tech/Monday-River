<title>River Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the studio drawn as a floor plan on blueprint. Top row of rooms: Green room (Queue) · Edit suites (one per editor, each with
   a 3-week timeline and a playhead on today) · Screening room (Client Review, VIP row for corporate clients). Below: Master control,
   with the mixing console (editor load vs capacity, drag-to-reassign), the On-air board (sessions booked → units arriving vs capacity)
   and the bottleneck meter. Dark-only, like River. */
:root{
  color-scheme:dark;
  --night:#06080C; --floor:#090C12; --card:#0E131B; --hover:#151D2A; --line:rgb(160 200 255 / .08); --line-2:rgb(160 200 255 / .16); --wall:rgb(170 205 255 / .28);
  --ink:#EEF3FA; --ink-2:#C9D3E2; --muted:#8693A8; --faint:#55617A;
  --water:#3FA9FF; --foam:#BFE3FF; --sea:#9C8CFF;
  --brand:#FF003C; --late:#FF4D6A; --today:#F6B64A; --ok:#3EDC97;
  --st-queue:#8693A8; --st-assigned:#C9D3E2; --st-process:#F6C94A; --st-review:#5EB2FF; --st-corr:#FF8F45; --st-client:#3EDC97; --st-done:#9C8CFF; --st-other:#A68CFF;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased;background-color:var(--night);
  background-image:linear-gradient(rgb(120 170 255 / .035) 1px,transparent 1px),linear-gradient(90deg,rgb(120 170 255 / .035) 1px,transparent 1px),radial-gradient(1400px 700px at 50% -10%,#0F1A2B 0%,transparent 70%);
  background-size:28px 28px,28px 28px,auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.app{max-width:1560px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:grid;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--muted)}
.onair{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:.14em;padding:6px 12px;border-radius:6px;border:1px solid rgb(255 0 60 / .25);color:rgb(255 120 140 / .45);background:#14070B}
.onair.lit{color:#fff;background:#B00029;border-color:#FF003C;box-shadow:0 0 18px rgb(255 0 60 / .55),inset 0 0 8px rgb(255 255 255 / .2)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:grid;line-height:1.15}
.stat b{font:600 20px var(--f);letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.bad b{color:var(--late)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync i.stale{background:var(--today)} .sync i.off{background:var(--late)}
.btn-s{border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.btn-s:hover{background:var(--hover)}

/* floor plan */
.floor{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(0,3.2fr) minmax(250px,1.1fr);gap:0;border:3px solid var(--wall);border-radius:6px;background:rgb(9 12 18 / .85);position:relative}
@media (max-width:1100px){.floor{grid-template-columns:minmax(0,1fr)}}
.room{position:relative;padding:14px 14px 16px;min-width:0;display:grid;gap:10px;align-content:start}
.room + .room{border-left:3px solid var(--wall)}
@media (max-width:1100px){.room + .room{border-left:0;border-top:3px solid var(--wall)}}
/* a doorway: a gap in the wall with its swing arc */
.room.door::before{content:"";position:absolute;left:-3px;top:46px;width:3px;height:44px;background:var(--floor)}
.room.door::after{content:"";position:absolute;left:0;top:46px;width:44px;height:44px;border:1px dashed rgb(170 205 255 / .25);border-left:0;border-bottom:0;border-radius:0 44px 0 0}
@media (max-width:1100px){.room.door::before,.room.door::after{display:none}}
.plaque{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plaque b{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.plaque span{font-size:12px;color:var(--muted)}
.plaque em{margin-left:auto;font:500 11px var(--mono);font-style:normal;color:var(--faint)}
.hint{font-size:12px;color:var(--faint)}

/* green room */
.couch{display:grid;gap:6px}
.guest{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid var(--line-2);border-radius:10px;padding:7px 9px;background:var(--card);cursor:grab}
.guest:hover{background:var(--hover)}
.guest .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 10.5px var(--f);color:#05080D;background:var(--st-queue)}
.guest b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest small{display:block;font-size:11.5px;color:var(--muted)}
.guest.wait small{color:var(--today)} .guest.long small{color:var(--late)}

/* edit suites */
.suites{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.suite{border:2px solid var(--line-2);border-radius:8px;background:var(--card);display:grid;min-width:0;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.suite.drop{border-color:var(--water);box-shadow:0 0 0 3px rgb(63 169 255 / .2)}
.s-h{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg,rgb(255 255 255 / .025) 0 6px,transparent 6px 12px),linear-gradient(180deg,#121926,#0E131B)}
.lamp{font:600 9px var(--mono);letter-spacing:.12em;padding:2px 6px;border-radius:3px;color:rgb(255 120 140 / .35);border:1px solid rgb(255 0 60 / .2);background:#12070A}
.lamp.lit{color:#fff;background:#B00029;border-color:#FF003C;box-shadow:0 0 10px rgb(255 0 60 / .6)}
@media (prefers-reduced-motion:no-preference){.lamp.lit{animation:hum 3s ease-in-out infinite}@keyframes hum{50%{box-shadow:0 0 4px rgb(255 0 60 / .4)}}}
.s-h .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-h .no{font:500 10.5px var(--mono);color:var(--faint);letter-spacing:.1em}
.s-h .ld{margin-left:auto;display:flex;align-items:center;gap:7px;font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.bar{width:54px;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tl{position:relative;padding:6px 10px 8px}
.tl-days{position:relative;height:16px;font:500 9.5px var(--mono);color:var(--faint)}
.tl-days span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.tl-rows{position:relative;display:grid;gap:3px}
.tl-grid{position:absolute;inset:16px 10px 8px;pointer-events:none;background-image:linear-gradient(90deg,rgb(160 200 255 / .06) 1px,transparent 1px);background-size:calc(100% / 21) 100%}
.tl-wk{position:absolute;top:16px;bottom:8px;background:rgb(255 255 255 / .022)}
.ph{position:absolute;top:12px;bottom:4px;width:2px;background:var(--brand);box-shadow:0 0 8px rgb(255 0 60 / .7);z-index:2;pointer-events:none}
.ph::before{content:"";position:absolute;top:-4px;left:-4px;border:5px solid transparent;border-top-color:var(--brand)}
.clip{position:relative;height:22px;z-index:1}
.clip button{position:absolute;top:0;height:22px;min-width:10px;border-radius:4px;padding:0 6px;font-size:11.5px;font-weight:500;text-align:left;color:#05080D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));border:1px solid rgb(0 0 0 / .35);box-shadow:inset 0 -6px 8px -6px rgb(0 0 0 / .4)}
.clip button:hover{filter:brightness(1.1)}
.clip.late button{background:repeating-linear-gradient(135deg,var(--late) 0 6px,#E23A57 6px 12px);color:#fff}
.clip.today button{box-shadow:0 0 0 2px var(--today)}
.s-f{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px 9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.s-f b{color:var(--ink-2);font-weight:500}
.s-f .late-t{color:var(--late)}
.corridor{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.corridor > span{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--faint);margin-right:4px}
.free{border:1px dashed var(--line-2);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.free.drop{border-color:var(--water);color:var(--ink);background:rgb(63 169 255 / .12)}

/* screening room */
.screen{height:10px;border-radius:3px;background:linear-gradient(90deg,transparent,rgb(191 227 255 / .5),transparent);box-shadow:0 6px 22px rgb(191 227 255 / .25);margin:2px 12px 4px}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.seat{display:grid;justify-items:center;gap:1px;padding:6px 2px 5px;border-radius:9px 9px 5px 5px;border:1px solid var(--line-2);background:var(--card);border-bottom:3px solid var(--c)}
.seat:hover{background:var(--hover)}
.seat b{font:600 11px var(--f)}
.seat small{font:500 10.5px var(--mono);color:var(--c)}
.vip{display:grid;gap:6px;border-top:1px dashed var(--line-2);padding-top:10px}
.vip .plaque b{color:var(--sea)}

/* master control */
.master{border:3px solid var(--wall);border-radius:6px;background:linear-gradient(180deg,#0B0F16,#080B10);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
@media (max-width:1100px){.master{grid-template-columns:minmax(0,1fr)}}
.master > section{padding:14px 16px 16px;min-width:0;display:grid;gap:12px;align-content:start}
.master > section + section{border-left:3px solid var(--wall)}
@media (max-width:1100px){.master > section + section{border-left:0;border-top:3px solid var(--wall)}}
.console{display:flex;flex-wrap:wrap;gap:6px}
.strip{flex:0 0 78px;display:grid;grid-template-rows:auto 168px auto auto;gap:7px;justify-items:center;padding:9px 6px 8px;border-radius:7px;border:1px solid var(--line-2);
  background:linear-gradient(180deg,#151B26,#0D1219 60%,#0B0F15)}
.strip.drop{border-color:var(--water);box-shadow:0 0 0 3px rgb(63 169 255 / .22)}
.strip .ch{font:600 10px var(--mono);color:var(--faint);letter-spacing:.1em}
.track{position:relative;width:100%;display:flex;justify-content:center;gap:9px}
.meter{width:8px;display:flex;flex-direction:column-reverse;gap:2px}
.meter i{flex:1;border-radius:1px;background:#1B2330}
.meter i.on{background:var(--ok)} .meter i.on.amber{background:var(--today)} .meter i.on.red{background:var(--late);box-shadow:0 0 5px rgb(255 77 106 / .6)}
.rail{position:relative;width:6px;border-radius:3px;background:#05070A;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .06)}
.rail .cap{position:absolute;left:-7px;right:-7px;height:1px;background:rgb(255 255 255 / .35)}
.rail .cap::after{content:"cap";position:absolute;left:24px;top:-6px;font:500 8.5px var(--mono);color:var(--faint)}
.knob{position:absolute;left:50%;width:30px;height:16px;margin-left:-15px;margin-top:-8px;border-radius:3px;background:linear-gradient(180deg,#D9DFE8,#8E98A8);box-shadow:0 2px 4px rgb(0 0 0 / .6),inset 0 1px 0 #fff;transition:top .5s cubic-bezier(.2,.8,.2,1)}
.knob::after{content:"";position:absolute;left:3px;right:3px;top:7px;height:2px;background:#333B48}
.knob.over{background:linear-gradient(180deg,#FFB3C0,#E23A57)}
.strip .lv{font:600 13px var(--f)}
.strip .lv small{display:block;font:400 10px var(--mono);color:var(--muted);text-align:center}
.strip .nm{font-size:11.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.capin{display:flex;align-items:center;gap:3px;font:500 10.5px var(--mono);color:var(--muted)}
.capin button{width:18px;height:18px;border-radius:4px;border:1px solid var(--line-2);line-height:1;color:var(--ink-2)}
.capin button:hover{background:var(--hover)}
.board{display:grid;gap:8px}
.days{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:8px;position:relative}
.day{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;align-items:stretch}
.day .b{border-radius:3px 3px 0 0;min-height:0}
.day .b.in{background:var(--water)} .day .b.new{background:repeating-linear-gradient(135deg,var(--foam) 0 4px,#7FB8E6 4px 8px)} .day .b.due{background:var(--st-corr)}
.day .capline{position:absolute;left:-3px;right:-3px;height:2px;background:var(--ink);opacity:.55}
.day.over .capline{background:var(--late);opacity:1;box-shadow:0 0 6px var(--late)}
.dlabels{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;font:500 10.5px var(--mono);color:var(--muted);text-align:center}
.dlabels .over{color:var(--late)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.verdict{font-size:13.5px;color:var(--ink-2);border-left:3px solid var(--line-2);padding:2px 0 2px 10px}
.verdict.bad{border-color:var(--late)} .verdict.ok{border-color:var(--ok)}
.verdict b{color:var(--ink)}
.necks{display:grid;gap:6px}
.neck{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:12.5px}
.neck span{color:var(--ink-2)}
.neck .nb{height:14px;border-radius:3px;background:#121925;overflow:hidden}
.neck .nb i{display:block;height:100%;background:var(--c);opacity:.85}
.neck em{font:500 11px var(--mono);font-style:normal;color:var(--muted);text-align:right}
.neck.worst span{color:var(--ink);font-weight:600}
.neck.worst .nb{box-shadow:0 0 0 1px var(--late)}
.bks{display:grid;gap:4px;max-height:180px;overflow:auto}
.bk{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line)}
.bk time{font:500 11px var(--mono);color:var(--muted)}
.bk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk em{font:500 11px var(--mono);font-style:normal;color:var(--foam)}
.bk.laura{opacity:.5}
.empty{color:var(--muted);font-size:13px}
.banner{border:1px solid rgb(255 77 106 / .4);background:rgb(255 77 106 / .08);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.banner span{color:var(--muted)}
.skel{height:120px;border-radius:8px;background:linear-gradient(90deg,#0E131B,#151D2A,#0E131B);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.skel{animation:sh 1.3s linear infinite}@keyframes sh{to{background-position:-200% 0}}}
.dragging{opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* the illustrated floor */
.stage{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(1200px 700px at 50% 40%,#131A26 0%,#07090D 75%)}
#scene{display:block;width:100%;height:auto;min-width:0;user-select:none;touch-action:none}
#scene [data-ep],#scene [data-room],#scene [data-gep]{cursor:pointer}
#scene [data-gep]{cursor:grab}
#scene .hot:hover{filter:brightness(1.25) drop-shadow(0 0 6px rgb(191 227 255 / .5))}
#scene .booth.drop .floorhl{opacity:1}
#scene .floorhl{opacity:0;transition:opacity .15s}
@media (prefers-reduced-motion:no-preference){#scene .blink{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}
  #scene .flick{animation:flick 4s ease-in-out infinite}@keyframes flick{0%,100%{opacity:1}48%{opacity:.86}50%{opacity:.7}52%{opacity:.9}}}
.tip{position:absolute;z-index:4;pointer-events:none;background:#0E131B;border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:12.5px;max-width:280px;box-shadow:0 14px 30px -12px #000}
.tip b{display:block;font-weight:600} .tip span{color:var(--muted)}
.drawer{position:fixed;z-index:15;top:0;right:0;bottom:0;width:min(560px,100%);background:#0A0F17;border-left:1px solid var(--line-2);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px #000}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .2s ease-out}}
.d-h{display:flex;align-items:center;gap:8px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.d-h b{flex:1;font-size:15px;font-weight:600}
.d-b{overflow-y:auto;padding:16px 18px 30px;display:grid;gap:12px;align-content:start}
.d-b .suites{grid-template-columns:minmax(0,1fr)}
.d-b .console{justify-content:flex-start}
/* ===== River's episode panel (copied by studio/build.py) ===== */

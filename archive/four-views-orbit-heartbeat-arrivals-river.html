<title>Poddster Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one radar fills the screen; you are the centre. Distance from centre = how soon an episode needs you (inside the red core = late).
   Sectors = pipeline stages, clockwise from the top. Right rail = briefing when nothing is picked, episode controls when something is.
   Dark-only by design: a radar reads against night. */
:root{
  color-scheme:dark;
  --space:#06070A; --rail:#0C0D11; --card:#111218; --hover:#171922; --line:rgb(255 255 255 / .07); --line-2:rgb(255 255 255 / .12);
  --ink:#F3F4F7; --ink-2:#CDD0D8; --muted:#8C90A0; --faint:#5E6273;
  --brand:#FF003C; --late:#FF3B5C; --today:#F4B23C; --ok:#3DD68C;
  --st-queue:#8C90A0; --st-assigned:#C9CCD6; --st-process:#F4C43C; --st-review:#5BA8FF; --st-corr:#FF8A3D; --st-client:#3DD68C; --st-other:#A68CFF; --st-done:#8B80F9;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--ink);font:400 13.5px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
kbd{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:0 5px}
.tnum{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage-area{position:relative;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 22px 0;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted);background:rgb(255 255 255 / .02)}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip.late{border-color:rgb(255 59 92 / .45);background:rgb(255 59 92 / .08)} .chip.late b{color:var(--late)}
.chip.today b{color:var(--today)}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;width:220px;color:var(--muted);background:rgb(255 255 255 / .02)}
.find input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.find input::placeholder{color:var(--faint)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync i.stale{background:var(--today)} .sync i.off{background:var(--late)}
.sync button{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;color:var(--ink-2);font-weight:500}
.sync button:hover{background:var(--hover)}

.radar-wrap{position:relative;min-height:0;display:grid;place-items:center;padding:8px 16px 16px}
svg.radar{width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1260/1140;display:block;overflow:visible}
.ring{fill:none;stroke:var(--line);stroke-width:1}
.ring.major{stroke:var(--line-2)}
.ring-l{fill:var(--faint);font:500 13px var(--mono);letter-spacing:.02em}
.spoke{stroke:var(--line);stroke-width:1}
.sec-l{font:600 15px var(--f);letter-spacing:.01em}
.sec-n{font:500 13px var(--mono);fill:var(--muted)}
.core{fill:url(#coreG)}
.core-edge{fill:none;stroke:rgb(255 59 92 / .5);stroke-width:1.5;stroke-dasharray:3 5}
.core-n{fill:var(--ink);font:600 54px var(--f);letter-spacing:-.03em}
.core-l{fill:var(--muted);font:500 15px var(--f)}
.sweep{transform-origin:500px 500px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.sweep{animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .dot.late .halo{animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{r:var(--r0);opacity:.55}100%{r:var(--r1);opacity:0}}}
@media (prefers-reduced-motion:reduce){.sweep{display:none}}
.dot{cursor:pointer;outline:none}
.dot .body{stroke:var(--space);stroke-width:2;transition:r .15s}
.dot .halo{fill:none;stroke-width:2}
.dot .ring-sel{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.dot:hover .ring-sel,.dot:focus-visible .ring-sel{opacity:.6}
.dot.sel .ring-sel{opacity:1}
.dot.dim{opacity:.14}
.lbl{font:500 14px var(--f);fill:var(--ink-2);paint-order:stroke;stroke:var(--space);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.lbl.late{fill:#FFC2CC}
.tip{position:absolute;pointer-events:none;z-index:5;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:280px;box-shadow:0 12px 30px -10px #000}
.tip b{display:block;font-weight:500}
.tip span{color:var(--muted)}
.legend{position:absolute;left:22px;bottom:18px;display:grid;gap:4px;font-size:12px;color:var(--muted);max-width:260px;pointer-events:none}
.legend b{color:var(--ink-2);font-weight:500}

/* rail */
.rail{background:var(--rail);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-h{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line);min-height:58px}
.rail-h h2{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.rail-b{overflow-y:auto;padding:18px;display:grid;gap:22px;align-content:start;flex:1}
.greet{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:0;text-wrap:balance}
.greet + p{margin:6px 0 0;color:var(--muted)}
.bl{display:grid;gap:2px}
.bl-h{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 6px}
.bi{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;margin:0 -10px;border-radius:8px;text-align:left;width:calc(100% + 20px)}
.bi:hover{background:var(--hover)}
.bi i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi small{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bi small.late{color:var(--late)} .bi small.today{color:var(--today)}
.say{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.say b{color:var(--ink-2);font-weight:500}

.d-title{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;border-radius:999px;padding:3px 10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.props{display:grid;grid-template-columns:88px minmax(0,1fr);gap:7px 10px;font-size:13px;margin:0}
.props dt{color:var(--muted)} .props dd{margin:0;min-width:0;overflow-wrap:anywhere}
.props .late{color:var(--late)} .props .today{color:var(--today)}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mv{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:9px;padding:8px 9px;font-size:12.5px;font-weight:500;text-align:left;min-height:38px}
.mv i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mv:hover:not([disabled]){background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.mv[disabled]{opacity:.35;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:none}
.lk:hover{background:var(--hover);color:var(--ink)}
.composer{border:1px solid var(--line-2);border-radius:12px;display:grid;background:rgb(255 255 255 / .02)}
.composer:focus-within{border-color:rgb(255 255 255 / .25)}
.composer textarea{border:0;outline:0;background:transparent;resize:vertical;min-height:84px;padding:10px 12px;line-height:1.5}
.composer textarea::placeholder{color:var(--faint)}
.c-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 8px 8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.c-bar label{display:inline-flex;gap:5px;align-items:center}
.c-bar input{accent-color:var(--brand)}
.post{margin-left:auto;background:var(--brand);color:#fff;border-radius:8px;padding:6px 12px;font-weight:500;font-size:12.5px}
.post:hover{background:#E00035}
.post[disabled]{opacity:.5}
.banner{border:1px solid rgb(255 59 92 / .4);background:rgb(255 59 92 / .08);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.banner span{color:var(--muted)}

.toast{position:fixed;z-index:40;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--space);padding:9px 10px 9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px)}
.toast button{color:var(--space);font-weight:600;padding:2px 8px;border-radius:6px;background:rgb(0 0 0 / .1)}
.toast.bad{background:var(--late);color:#fff}

@media (max-width:980px){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .stage-area{grid-template-rows:auto auto}
  .radar-wrap{height:min(100vw,640px)}
  .rail{border-left:0;border-top:1px solid var(--line)}
  .legend{position:static;padding:0 22px 12px}
  .find{width:auto;flex:1 1 160px}
}

/* ---- view switcher + panes ---- */
.views{display:flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:rgb(255 255 255 / .02)}
.views button{padding:5px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted)}
.views button:hover{color:var(--ink)}
.views button[aria-selected="true"]{background:var(--ink);color:var(--space)}
.pane{min-height:0;overflow-y:auto;padding:14px 22px 40px;display:grid;gap:12px;align-content:start}
.v-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.v-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.v-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.v-stats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip.good b{color:var(--ok)}
.btn-s{border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.btn-s:hover{background:var(--hover)}
.v-empty{display:grid;gap:6px;justify-items:start;padding:40px 4px;color:var(--muted)}
.v-empty b{color:var(--ink);font-weight:600;font-size:15px}
.v-note{margin:6px 0 0;font-size:12px;color:var(--muted);max-width:80ch}
.skel{display:block;height:10px;border-radius:5px;background:var(--hover);width:60%}
.skel-row{pointer-events:none}
.late{color:var(--late)} .today{color:var(--today)}

/* ---- heartbeat ---- */
.hb-axis,.hb-row{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;gap:16px;align-items:center}
.hb-ticks{position:relative;height:16px;font:500 11px var(--mono);color:var(--faint)}
.hb-ticks span{position:absolute;transform:translateX(-50%)}
.hb-ticks span:first-child{transform:none} .hb-ticks span:last-child{transform:translateX(-100%)}
.hb-row{width:100%;text-align:left;padding:10px 12px;margin:0 -12px;border-radius:12px;border:1px solid transparent}
.hb-row:hover{background:var(--hover)}
.hb-row.sel{background:var(--hover);border-color:var(--line-2)}
.hb-name{min-width:0;display:grid}
.hb-name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-name small{color:var(--muted);font-size:12px}
.ecg{width:100%;height:56px;display:block;overflow:visible}
.ecg-base{stroke:var(--line);stroke-width:1}
.ecg-line{fill:none;stroke:var(--st-client);stroke-width:1.8;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px rgb(61 214 140 / .5))}
.ecg-line.amber{stroke:var(--today);filter:drop-shadow(0 0 4px rgb(244 178 60 / .5))}
.ecg-flat{stroke:var(--late);stroke-width:2.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px rgb(255 59 92 / .6))}
.ecg-peak{fill:var(--ink)}
.ecg-skel{display:block;height:2px;background:var(--line-2)}
@media (prefers-reduced-motion:no-preference){.ecg-line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}}
.hb-st{display:grid;text-align:right}
.hb-st b{font-weight:600;font-variant-numeric:tabular-nums}
.hb-st small{color:var(--muted);font-size:12px}
@media (max-width:760px){.hb-axis{display:none}.hb-row{grid-template-columns:minmax(0,1fr) 110px}.hb-row .ecg{grid-column:1 / -1;grid-row:2}}
.ev{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.ev i{width:8px;height:8px;border-radius:50%;background:var(--st-assigned)}
.ev i.in{background:var(--st-client)} .ev i.fio{background:var(--st-other)}
.ev small{color:var(--muted)}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpls button{border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.tpls button.on{border-color:var(--brand);color:var(--ink);background:rgb(255 0 60 / .1)}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.fld input{border:1px solid var(--line-2);border-radius:9px;background:rgb(255 255 255 / .02);padding:8px 10px;color:var(--ink);outline:0;font-size:13.5px}
.fld input:focus{border-color:rgb(255 255 255 / .25)}
.banner.ok{border-color:rgb(61 214 140 / .4);background:rgb(61 214 140 / .08)}
.banner{gap:6px}

/* ---- arrivals ---- */
.board{background:#0A0B0F;border:1px solid var(--line-2);border-radius:16px;padding:8px;display:grid;gap:3px;box-shadow:inset 0 1px 0 rgb(255 255 255 / .04),0 24px 50px -30px #000}
.fl-head,.fl-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto 128px;gap:10px;align-items:center}
.fl-head{padding:6px 10px;font:500 11px var(--mono);color:var(--faint)}
.fl-sec{display:flex;gap:8px;align-items:baseline;padding:12px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.fl-sec span{font:500 11px var(--mono);color:var(--faint)}
.fl-row{width:100%;text-align:left;padding:6px 10px;border-radius:10px}
.fl-row:hover{background:var(--hover)}
.fl-row.sel{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line-2)}
.fl{display:flex;gap:2px;min-width:0;overflow:hidden;align-items:center}
.fl i{font:500 13px/1 var(--mono);font-style:normal;width:1.15em;height:1.7em;display:grid;place-items:center;flex:none;color:#F2E6C9;background:linear-gradient(#1A1C23 49%,#0E0F14 51%);border-radius:3px;box-shadow:inset 0 -1px 0 rgb(0 0 0 / .6),0 1px 0 rgb(255 255 255 / .04)}
.fl.t i{color:var(--today)}
.tag{font:600 10px var(--mono);font-style:normal;color:var(--space);background:var(--st-other);border-radius:4px;padding:2px 5px;margin-left:6px;flex:none}
.fl-st{justify-self:end;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.fl-st.landed{color:var(--today);background:rgb(244 178 60 / .1)}
.fl-st.onair{color:#fff;background:var(--brand);border-color:var(--brand)}
.fl-st.sched{color:var(--muted)}
.fl-st.donei{color:var(--ok)}
.fl-st.newc{color:var(--st-other);background:rgb(166 140 255 / .1)}
@media (prefers-reduced-motion:no-preference){.fl i{animation:flip .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}@keyframes flip{from{transform:rotateX(90deg);opacity:.2}}}
@media (max-width:900px){.fl-head{display:none}.fl-row{grid-template-columns:auto minmax(0,1fr) auto}.fl.d,.fl.s{display:none}.fl i{width:1.05em}}
.intake{display:grid;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:14px}
.intake ol{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}

/* ---- river ---- */
.river-wrap{border:1px solid var(--line);border-radius:18px;background:radial-gradient(900px 300px at 50% 55%,rgb(91 168 255 / .06),transparent 70%);padding:8px 4px;overflow-x:auto}
svg.river{display:block;width:100%;min-width:720px;height:auto}
.rv-gate{stroke:rgb(255 255 255 / .06);stroke-dasharray:2 4}
.rv-l{font:600 15px var(--f)}
.rv-n{font:600 22px var(--f);fill:var(--ink)}
.rv-late{font:500 13px var(--mono);fill:var(--late)}
.rv-bn{font:500 13px var(--f);fill:var(--today)}
.fish{cursor:pointer;outline:none}
.fish:focus-visible circle{stroke:var(--brand);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.fish{animation:swim var(--dur) ease-in-out infinite alternate;animation-delay:var(--del)}@keyframes swim{from{transform:translateX(-6px)}to{transform:translateX(6px)}}}

</style>

<div class="app">
  <section class="stage-area" aria-label="Episode radar">
    <header class="hud">
      <div class="brand">
        <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#FF003C"/><rect x="12" y="8" width="16" height="18" rx="8" fill="none" stroke="#fff" stroke-width="3.6"/><path d="M13.8 22v11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>
        <div><b>Orbit</b><span>Poddster producer desk</span></div>
      </div>
      <nav class="views" id="views" role="tablist" aria-label="Views"></nav>
      <div class="chips" id="chips"></div>
      <label class="find"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Highlight a client or editor" aria-label="Highlight episodes"><kbd>/</kbd></label>
      <div class="sync"><i id="sync-dot"></i><span id="sync-t">Connecting</span><button type="button" id="refresh">Sync</button></div>
    </header>
    <div class="radar-wrap" id="wrap"><div id="pane-orbit" style="display:contents"></div>
      <svg class="radar" id="radar" viewBox="-130 -70 1260 1140" role="group" aria-label="Episodes arranged by stage and urgency"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="pane" id="pane-heart" hidden></div>
    <div class="pane" id="pane-arr" hidden></div>
    <div class="pane" id="pane-river" hidden></div>
    <div class="legend" id="legend"><span><b>Closer to you</b> means it needs you sooner. Inside the red core is late.</span><span>In Client Review, closer means the client has been quiet longer.</span></div>
  </section>
  <aside class="rail" aria-label="Briefing and episode details">
    <div class="rail-h" id="rail-h"><h2>Briefing</h2></div>
    <div class="rail-b" id="rail-b"></div>
  </aside>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const SERVER = "monday.com";
const BOARD = 2472462203;
const BOARD_URL = "https://poddsterstudios-team.monday.com/boards/" + BOARD;
const COLS = ["status","person","date","date4","date_mkx87nb3","dup__of_1st_cut_deadline","status_1","board_relation_mkxb8cpz","link_mm22fna1","link_mkxbtnjf","link_mkxbm8as","numeric_mm1y5e6b"];

const FLOW = ["Queue","Assigned","In Process","In Review","Corrections","Client Review","Done"];
function seeded(id, k) { let h = 2166136261; const s = id + ":" + k; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }

  const band = curve([[0, mid - 12], ...topPts, [W, mid - half[half.length - 1] * .7]], true) + " " + curve([[W, mid + half[half.length - 1] * .7], ...botPts, [0, mid + 12]], false) + " Z";

  groups.forEach((g, k) => {

    g.filter(matches).forEach(it => {

  const t = $("toast"); t.className = "toast" + (o.bad ? " bad" : "");
  t.innerHTML = `<span>${esc(text)}</span>${o.undo ? `<button type="button" id="undo">Undo</button>` : ""}`;
  t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, o.undo ? 6000 : 3500);
  if (o.undo) $("undo").onclick = () => { t.hidden = true; o.undo(); };
}
function writeErr(e) {
  if (e && (e.code === "server_unavailable" || e.code === "upstream_error")) return "Monday didn't confirm the change. Sync to check before trying again.";
  const m = errorCopy(e); return m.title + ". " + m.body;
}
async function setStage(it, lbl, isUndo) {
  if (!mcp || S.busy || !it || it.stage === lbl) return;
  const prev = it.stage; S.busy = true; it.stage = lbl; render();
  try {
    await mcp.callTool(SERVER, "change_item_column_values", { boardId: BOARD, itemId: Number(it.id), columnValues: JSON.stringify({ status: { label: lbl } }) }, { cache: false });
    toast(isUndo ? "Restored to " + lbl : lbl === "Done" ? "Done. One less in orbit." : "Moved to " + lbl, isUndo ? {} : { undo: () => setStage(it, prev, true) });
    if (lbl === "Done") S.sel = null;
    mcp.invalidate(SERVER, "get_board_items_page").catch(() => {});
  } catch (e) { it.stage = prev; toast(writeErr(e), { bad: true }); }
  finally { S.busy = false; render(); }
}
async function postNote() {
  const it = S.items.find(i => i.id === S.sel); const text = (S.draft || "").trim();
  if (!it || !mcp || S.busy) return;
  if (!text) { toast("Write the note first.", { bad: true }); return; }
  S.busy = true; renderRail();
  try {
    const input = { itemId: Number(it.id), body: esc(text).replace(/\n/g, "<br>") };
    const mid = S.mention ? EDITOR_IDS[firstName(it.editor).toLowerCase()] : null;
    if (mid) input.mentionsList = JSON.stringify([{ id: mid, type: "User" }]);
    await mcp.callTool(SERVER, "create_update", input, { cache: false });
    let moved = false;
    if (S.corr && it.stage !== "Corrections") {
      await mcp.callTool(SERVER, "change_item_column_values", { boardId: BOARD, itemId: Number(it.id), columnValues: JSON.stringify({ status: { label: "Corrections" } }) }, { cache: false });
      it.stage = "Corrections"; moved = true;
    }
    S.draft = ""; toast(moved ? "Note posted, moved to Corrections" : "Note posted");
    mcp.invalidate(SERVER, "get_board_items_page").catch(() => {});
  } catch (e) { toast(writeErr(e), { bad: true }); }
  finally { S.busy = false; render(); }
}
function select(id) { if (S.sel !== id) { S.draft = ""; S.corr = true; S.mention = true; } S.sel = id; $("tip").hidden = true; render(); }
function deselect() { if (S.sel) S.sel = null; else { S.selClient = null; S.selBook = null; S.nudge = null; S.intake = null; } render(); }
function sync() { if (!mcp) return; S.loading = true; $("sync-t").textContent = "Syncing"; mcp.invalidate(SERVER, "get_board_items_page").catch(() => {}); if (S.view === "heart") loadHeart(true); if (S.view === "arr") loadBookings(true); }

/* ---------- events ---------- */
const radar = $("radar"), tip = $("tip"), wrap = $("wrap");
radar.addEventListener("click", e => { const g = e.target.closest(".dot"); if (g) select(g.dataset.id); else if (S.sel) deselect(); });
radar.addEventListener("keydown", e => { const g = e.target.closest(".dot"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(g.dataset.id); } });
function showTip(g, ev) {
  const it = S.items.find(i => i.id === g.dataset.id); if (!it) return;
  const r = it.stage === "Client Review" ? ageDays(it) + " days with the client" : rel(nextDue(it)).txt;
  tip.innerHTML = `<b>${esc(it.name)}</b><span>${esc(it.stage)}, ${esc(r)}${it.editor ? ", " + esc(it.editor) : ""}</span>`;
  const wr = wrap.getBoundingClientRect(); let x, y;
  if (ev && ev.clientX) { x = ev.clientX - wr.left + 14; y = ev.clientY - wr.top + 14; }
  else { const br = g.getBoundingClientRect(); x = br.right - wr.left + 8; y = br.top - wr.top; }
  tip.hidden = false;
  tip.style.left = Math.min(x, wr.width - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(y, wr.height - tip.offsetHeight - 8) + "px";
}
radar.addEventListener("pointermove", e => { const g = e.target.closest(".dot"); if (g) showTip(g, e); else tip.hidden = true; });
radar.addEventListener("pointerleave", () => tip.hidden = true);
radar.addEventListener("focusin", e => { const g = e.target.closest(".dot"); if (g) showTip(g); });
radar.addEventListener("focusout", () => tip.hidden = true);
function pickClient(k) { S.sel = null; if (S.selClient !== k) S.nudge = null; S.selClient = k; renderHeart(); renderRail(); }
function pickBook(k) { S.sel = null; if (S.selBook !== k) S.intake = null; S.selBook = k; renderArr(); renderRail(); }
$("views").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) setView(b.dataset.v); });
["pane-heart","pane-arr","pane-river"].forEach(id => $(id).addEventListener("click", e => {
  const c = e.target.closest("[data-client]"); if (c) return pickClient(c.dataset.client);
  const b = e.target.closest("[data-book]"); if (b) return pickBook(b.dataset.book);
  const f = e.target.closest("[data-id]"); if (f) return select(f.dataset.id);
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "heart-retry") { S.heartErr = null; loadHeart(true); }
  if (a.dataset.act === "arr-retry") { S.bookErr = null; loadBookings(true); }
}));
$("pane-river").addEventListener("keydown", e => { const f = e.target.closest(".fish"); if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(f.dataset.id); } });
$("rail-b").addEventListener("click", e => {
  const c = e.target.closest("[data-client]"); if (c) { pickClient(c.dataset.client); return; }
  const bk = e.target.closest("[data-book]"); if (bk) { pickBook(bk.dataset.book); return; }
  const tp = e.target.closest("[data-tpl]"); if (tp && S.nudge) { const g = S.heart.list.find(x => x.key === S.nudge.key); S.nudge.subject = $("n-subj") ? $("n-subj").value : S.nudge.subject; S.nudge.tpl = tp.dataset.tpl; S.nudge.body = NUDGES[tp.dataset.tpl].body((g && g.first) || "there"); renderRail(); return; }
  const ac = e.target.closest("[data-act]");
  if (ac && ac.dataset.act === "nudge") { const g = S.heart.list.find(x => x.key === S.selClient); if (g) { openNudge(g); renderRail(); } return; }
  if (ac && ac.dataset.act === "mkdraft") { createNudge(); return; }
  if (ac && ac.dataset.act === "intake") { runIntake(); return; }
  const b = e.target.closest("[data-id]"); if (b) { select(b.dataset.id); return; }
  const it = S.items.find(i => i.id === S.sel); if (!it) return;
  const st = e.target.closest("[data-stage]"); if (st) { setStage(it, st.dataset.stage); return; }
  if (e.target.closest("[data-act='post']")) postNote();
});
$("rail-h").addEventListener("click", e => { if (e.target.closest("[data-act='close'],[data-act='back']")) deselect(); });
$("rail-b").addEventListener("input", e => { if (e.target.id === "note") S.draft = e.target.value; if (S.nudge && e.target.id === "n-body") S.nudge.body = e.target.value; if (S.nudge && e.target.id === "n-subj") S.nudge.subject = e.target.value; });
$("rail-b").addEventListener("change", e => { if (e.target.id === "corr") S.corr = e.target.checked; if (e.target.id === "mention") S.mention = e.target.checked; });
$("q").addEventListener("input", e => { S.q = e.target.value.trim(); if (S.view === "orbit") renderRadar(); renderHeart(); renderArr(); renderRiver(); renderRail(); });
$("refresh").addEventListener("click", sync);
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing) {
    if (e.target.id === "note" && (e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); postNote(); }
    if (e.key === "Escape") { if (e.target.id === "q") { e.target.value = ""; S.q = ""; renderRadar(); renderRail(); } e.target.blur(); }
    return;
  }
  if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  else if (/^[1-4]$/.test(e.key)) setView(VIEWS[+e.key - 1][0]);
  else if (e.key === "Escape" && (S.sel || S.selClient || S.selBook)) deselect();
  else if (e.key === "r" || e.key === "R") sync();
  else if (e.key === "n" || e.key === "N") { const top = onRadar().sort((a, b) => urgency(a) - urgency(b))[0]; if (top) select(top.id); }
});

/* ---------- data ---------- */
async function loadMore(cursor, acc, depth) {
  if (!cursor || depth > 3) return acc;
  try {
    const r = await mcp.callTool(SERVER, "get_board_items_page", { boardId: BOARD, includeColumns: true, includeGroup: false, columnIds: COLS, limit: 500, cursor }, { cache: { staleTime: 30000 } });
    const p = r.payload || {}; acc.push(...(p.items || []));
    return loadMore(p.pagination && p.pagination.has_more ? p.pagination.nextCursor : null, acc, depth + 1);
  } catch (e) { return acc; }
}
async function start() {
  setInterval(renderSync, 30000);
  render();
  try { mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { mcp = null; }
  if (!mcp) { S.loading = false; S.error = { code: "no_mcp" }; render(); return; }
  if (S.view === "arr") loadBookings();
  loadClients();
  mcp.watchTool(SERVER, "get_board_items_page", INPUT, async ev => {
    if (ev.type === "error") {
      const c = ev.error && ev.error.code;
      if (["needs_reauth","server_not_connected","selection_required","not_in_manifest","not_granted","blocked_by_policy","approval_required","capability_disabled"].includes(c)) S.items = [];
      S.error = ev.error; S.loading = false; render(); return;
    }
    const p = ev.result.payload || {};
    let raw = p.items || [];
    if (p.pagination && p.pagination.has_more) raw = await loadMore(p.pagination.nextCursor, raw.slice(), 1);
    S.items = raw.map(norm);
    S.storedAt = ev.result.cache ? ev.result.cache.storedAt : Date.now();
    S.error = null; S.loading = !!(ev.result.cache && ev.result.cache.revalidating);
    render();
    if (S.view === "heart" && !S.heart) loadHeart();
  }, { refetchInterval: 45000, cache: { staleTime: 30000 } });
}
start();
</script>

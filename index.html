<title>Poddster River</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the whole screen is the river. Header (level gauge + flow numbers + editor filter) → river canvas (stages as reaches, gates between them,
   the sea of finished work at the mouth) → "pressing on the gates" list. Episode panel slides over from the right.
   Encoding: within a reach, an episode drifts toward the next gate as its deadline nears; overdue ones press against the gate and glow red.
   Drag an episode across a gate to move it to that stage. Dark-only: water reads best at night. */
:root{
  color-scheme:dark;
  --night:#05080D; --card:#0F1520; --hover:#151D2A; --line:rgb(160 200 255 / .08); --line-2:rgb(160 200 255 / .15);
  --ink:#EEF3FA; --ink-2:#C9D3E2; --muted:#8693A8; --faint:#55617A;
  --water:#3FA9FF; --foam:#BFE3FF;
  --brand:#FF003C; --late:#FF4D6A; --today:#F6B64A; --ok:#3EDC97;
  --st-queue:#8693A8; --st-assigned:#C9D3E2; --st-process:#F6C94A; --st-review:#5EB2FF; --st-corr:#FF8F45; --st-client:#3EDC97; --st-done:#9C8CFF; --st-other:#A68CFF;
  --f:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1400px 700px at 50% 30%,#0C1626 0%,var(--night) 70%);background-color:var(--night);color:var(--ink);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.app{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:grid;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;width:230px;color:var(--muted);background:rgb(255 255 255 / .02)}
.find input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.find input::placeholder{color:var(--faint)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .sync i.stale{background:var(--today)} .sync i.off{background:var(--late)}
.btn-s{border:1px solid var(--line-2);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.btn-s:hover{background:var(--hover)}
.level{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.level{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gauge,.stat{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,rgb(255 255 255 / .025),transparent)}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.tube{width:22px;height:72px;border-radius:12px;border:1px solid var(--line-2);position:relative;overflow:hidden;background:rgb(0 0 0 / .3)}
.tube i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--foam),var(--water));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.tube.rising i{background:linear-gradient(#FFC6CF,var(--late))}
.gauge b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em}
.gauge b.rising{color:var(--late)} .gauge b.draining{color:var(--ok)}
.gauge p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.stat small{font-size:12px;color:var(--muted)}
.stat b.bad{color:var(--late)} .stat b.good{color:var(--ok)}
.tribs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tribs > span{font-size:12.5px;color:var(--muted);margin-right:4px}
.trib{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:999px;padding:4px 11px 4px 5px;font-size:12.5px;color:var(--ink-2)}
.trib:hover{background:var(--hover)}
.trib[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink)}
.trib em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.trib[aria-pressed="true"] em{color:#3B4658}
.trib.idle{color:var(--muted)} .trib.idle .av{opacity:.55}
.tribs.drag .trib[data-eid]{border-style:dashed;border-color:rgb(63 169 255 / .5)}
.tribs.drag .trib.drop{border-style:solid;border-color:var(--water);background:rgb(63 169 255 / .16);color:var(--ink);box-shadow:0 0 0 3px rgb(63 169 255 / .18)}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;background:var(--ac,#55617A);flex:none}
.river-box{position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:radial-gradient(1000px 360px at 45% 55%,rgb(63 169 255 / .07),transparent 70%),linear-gradient(180deg,#081019,#05080D)}
.river-scroll{overflow-x:auto}
svg.river{display:block;width:100%;min-width:900px;height:auto;touch-action:none;user-select:none}
.bank{fill:none;stroke:rgb(150 200 255 / .28);stroke-width:1.4}
.gate{stroke:rgb(190 225 255 / .28);stroke-width:1.5;stroke-dasharray:3 5}
.gate.hot{stroke:var(--late);stroke-width:2.5;stroke-dasharray:none;filter:drop-shadow(0 0 6px rgb(255 77 106 / .8))}
.zone.drop{fill:rgb(63 169 255 / .10)}
.current{fill:none;stroke:rgb(191 227 255 / .22);stroke-width:1.2;stroke-linecap:round;stroke-dasharray:14 46}
@media (prefers-reduced-motion:no-preference){.current{animation:flow 5s linear infinite}.current.c2{animation-duration:7s;stroke-dasharray:8 60}.current.c3{animation-duration:9s;stroke-dasharray:20 80}@keyframes flow{to{stroke-dashoffset:-240}}}
.st-l{font:600 16px var(--f)}
.st-n{font:600 30px var(--f);fill:var(--ink);letter-spacing:-.03em}
.st-late{font:500 13px var(--mono);fill:var(--late)}
.st-hint{font:500 16px var(--f);fill:var(--muted)}
.sea-n{font:700 58px var(--f);fill:var(--st-done);letter-spacing:-.04em}
.sea-l{font:500 14px var(--f);fill:var(--ink-2)}
.sea-s{font:500 12px var(--f);fill:var(--muted)}
.bn{font:600 13px var(--f);fill:var(--today)}
.fish{cursor:grab;outline:none}
.fish.dragging{cursor:grabbing}
.fish .b{stroke:var(--night);stroke-width:2}
.fish .glow{fill:none;stroke:var(--late);stroke-width:2;opacity:.6}
.fish .sel{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.fish:hover .sel,.fish:focus-visible .sel{opacity:.6}
.fish.is-sel .sel{opacity:1}
.fish.dim{opacity:.12;cursor:default}
.fish-l{font:500 12px var(--f);fill:var(--ink-2);paint-order:stroke;stroke:#060B12;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.fish-l.late{fill:#FF8A9C} .fish-l.today{fill:var(--today)} .fish-l.on{fill:var(--ink);font-weight:600}
.fish-l .tag{fill:var(--muted);font-weight:400}
.ini{font:700 8.5px var(--f);fill:#05080D;pointer-events:none;letter-spacing:.02em}
.fish.dim .ini{opacity:0}
.names{position:absolute;top:10px;right:12px;z-index:3;display:flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:rgb(5 8 13 / .7);font-size:12px}
.names span{color:var(--muted);padding:3px 6px 3px 8px}
.names button{padding:3px 10px;border-radius:999px;color:var(--muted)}
.names button[aria-pressed="true"]{background:var(--ink);color:var(--night);font-weight:500}
@media (prefers-reduced-motion:no-preference){.fish:not(.dragging) .bob{animation:bob var(--dur) ease-in-out infinite alternate;animation-delay:var(--del)}@keyframes bob{from{transform:translate(-2px,-2px)}to{transform:translate(2px,2px)}}
  .fish .glow{animation:pulse 2.2s ease-out infinite}@keyframes pulse{from{opacity:.7;stroke-width:2}to{opacity:0;stroke-width:9}}}
.tip{position:absolute;z-index:4;pointer-events:none;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;font-size:12.5px;max-width:300px;box-shadow:0 14px 30px -12px #000}
.tip b{display:block;font-weight:500}
.tip span{color:var(--muted)}
.hint{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink-2);font-weight:500}
.sec h2{margin:6px 0 10px;font-size:15px;font-weight:600}
.sec h2 small{font-weight:400;color:var(--muted);margin-left:8px}
.press{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.pi{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgb(255 255 255 / .015)}
.pi:hover{background:var(--hover);border-color:var(--line-2)}
.pi i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pi span{min-width:0}
.pi b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--late);white-space:nowrap}
.empty{color:var(--muted);padding:12px 0}
.banner{border:1px solid rgb(255 77 106 / .4);background:rgb(255 77 106 / .08);border-radius:14px;padding:12px 16px;display:grid;gap:2px}
.banner span{color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:20;background:rgb(2 4 8 / .5)}
.panel{position:fixed;z-index:21;top:0;right:0;bottom:0;width:min(440px,100%);background:#0A0F17;border-left:1px solid var(--line-2);display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px #000}
.p-h{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px 20px;border-bottom:1px solid var(--line)}
.p-h span{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.p-b{overflow-y:auto;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:22px;align-content:start}
.p-b h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;border-radius:999px;padding:3px 10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);justify-self:start}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.props{display:grid;grid-template-columns:90px minmax(0,1fr);gap:7px 10px;font-size:13.5px;margin:0}
.props dt{color:var(--muted)} .props dd{margin:0;min-width:0;overflow-wrap:anywhere}
.props .late{color:var(--late)} .props .today{color:var(--today)}
.lbl{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 8px}
.pkg{border:1px solid var(--line, rgba(255,255,255,.08));border-radius:12px;padding:12px 14px;display:grid;gap:10px;background:rgba(63,169,255,.04)}
.pkg .lbl{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pkg .lbl a{color:var(--water, #BFE3FF);font-weight:500;text-decoration:none} .pkg .lbl a:hover{text-decoration:underline}
.pkg dd{white-space:pre-line} .pkg .muted{color:var(--muted);font-size:13px;margin:0}
.pkg .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;color:#9C8CFF;margin-left:6px;vertical-align:1px}
.pkg + .pkg{margin-top:-4px}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mv{display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:9px;padding:8px 9px;font-size:12.5px;font-weight:500;text-align:left;min-height:40px}
.mv i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mv:hover:not([disabled]){background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.mv[disabled]{opacity:.35;cursor:default}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2);text-decoration:none}
.lk:hover{background:var(--hover);color:var(--ink)}
.composer{border:1px solid var(--line-2);border-radius:12px;display:grid;background:rgb(255 255 255 / .02)}
.composer:focus-within{border-color:rgb(190 225 255 / .3)}
.composer textarea{border:0;outline:0;background:transparent;resize:vertical;min-height:90px;padding:10px 12px;line-height:1.5}
.composer textarea::placeholder{color:var(--faint)}
.c-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 8px 8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.c-bar label{display:inline-flex;gap:5px;align-items:center}
.c-bar input{accent-color:var(--brand)}
.post{margin-left:auto;background:var(--brand);color:#fff;border-radius:8px;padding:7px 13px;font-weight:500;font-size:12.5px}
.post:hover{background:#E00035}
.post[disabled]{opacity:.5}
.add{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border-radius:999px;padding:7px 15px;font-weight:600;font-size:13px}
.add:hover{background:#E00035}
.add kbd{font:500 11px var(--mono);border:1px solid rgb(255 255 255 / .4);border-radius:5px;padding:0 5px}
.form{display:grid;gap:14px}
.fld{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line-2);border-radius:9px;background:rgb(255 255 255 / .03);padding:9px 11px;color:var(--ink);outline:0;font-size:14px;width:100%}
.fld input:focus,.fld select:focus{border-color:rgb(190 225 255 / .35)}
.fld select option{background:#0A0F17}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
.kinds button[aria-pressed="true"]{border-color:var(--water);color:var(--ink);background:rgb(63 169 255 / .12)}
.sum{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.sum b{color:var(--ink);font-weight:500}
.f-acts{display:flex;gap:8px;align-items:center}
.f-acts .post{margin-left:0}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--night);padding:9px 10px 9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px)}
.toast button{color:var(--night);font-weight:600;padding:2px 8px;border-radius:6px;background:rgb(0 0 0 / .1)}
.toast.bad{background:var(--late);color:#fff}
/* Monday notifications: bell + inbox drawer */
.bell{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--ink-2)}
.bell:hover{background:var(--hover);color:var(--ink)}
.bell b{position:absolute;top:-4px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font:600 11px/18px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--night)}
@media (prefers-reduced-motion:no-preference){.bell.ping svg{animation:ring .9s ease-in-out 2}@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}}
.inbox{z-index:22}
.nf-filters{display:flex;flex-wrap:wrap;gap:6px}
.nf-filters button{border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.nf-filters button[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink);font-weight:500}
.nf-filters em{font-style:normal;font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}
.nf-list{display:grid;gap:6px}
.nf{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgb(255 255 255 / .015);text-align:left;width:100%}
.nf.new{border-color:rgb(255 0 60 / .35);background:rgb(255 0 60 / .05)}
.nf .av{width:28px;height:28px;font-size:11px}
.nf .av.auto{background:#2A3446;color:var(--muted)}
.nf-top{display:flex;gap:6px;align-items:baseline;font-size:13px;min-width:0}
.nf-top b{font-weight:600;white-space:nowrap}
.nf-top span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.nf-top small{font:400 11.5px var(--mono);color:var(--faint);white-space:nowrap}
.nf-body{margin:4px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nf-ep{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:7px;font-size:12px}
.nf-ep button,.nf-ep a{color:var(--foam);text-decoration:none;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nf-ep button:hover,.nf-ep a:hover{text-decoration:underline}
.nf-ep .st{display:inline-flex;align-items:center;gap:5px;color:var(--muted)} .nf-ep .st i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.nf-ep .rp{margin-left:auto;border:1px solid var(--line-2);border-radius:7px;padding:3px 9px;color:var(--ink-2);text-decoration:none}
.nf-ep .rp:hover{background:var(--hover);text-decoration:none}
.nf .composer{margin-top:8px}
.nf .composer textarea{min-height:64px}
.nf-more{justify-self:center}
.pn-list{display:grid;gap:6px}
.pn{font-size:13px;color:var(--ink-2);border-left:2px solid var(--line-2);padding:2px 0 2px 10px}
.pn b{font-weight:600;color:var(--ink)} .pn small{font:400 11.5px var(--mono);color:var(--faint);margin-left:6px}
/* Live: ripples on dots changed elsewhere, and a feed beside the pressing list */
.ripple{fill:none;stroke:var(--foam);stroke-width:2;opacity:.85;stroke-dasharray:3 3;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.ripple{stroke-dasharray:none;transform-box:fill-box;transform-origin:center;animation:ripple 2s ease-out 3 both}@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(3.6);opacity:0}}}
.below{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:900px){.below{grid-template-columns:minmax(0,1fr)}}
.live h2{display:flex;align-items:center;gap:8px}
.live h2 i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
@media (prefers-reduced-motion:no-preference){.live h2 i{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}}
.feed{display:grid;gap:2px;border:1px solid var(--line);border-radius:12px;padding:4px;background:rgb(255 255 255 / .015)}
.lv{display:grid;grid-template-columns:8px minmax(0,1fr);gap:4px 10px;align-items:baseline;text-align:left;border-radius:8px;padding:7px 9px;font-size:13px;color:var(--ink-2)}
.lv:hover{background:var(--hover)}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--c);align-self:center}
.lv small{grid-column:2;font:400 11.5px var(--mono);color:var(--muted)}
.lv.fresh{background:rgb(63 169 255 / .08)}
.feed .empty{padding:10px 9px;font-size:13px}
/* Clear the gates: focus mode, one overdue episode at a time */
.gbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid rgb(255 77 106 / .45);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--ink)}
.gbtn:hover{background:rgb(255 77 106 / .1)}
.gbtn b{font:500 12px var(--mono);color:var(--late)}
.gbtn.clear{border-color:var(--line-2);color:var(--ink-2)} .gbtn.clear b{color:var(--ok)}
.gbtn kbd,.mv kbd{font:500 11px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--muted)}
.gates{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:16px;background:rgb(2 4 8 / .74);backdrop-filter:blur(6px)}
.g-card{width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#0A0F17;border:1px solid var(--line-2);border-radius:20px;box-shadow:0 40px 80px -30px #000;outline:none}
.g-top{display:flex;align-items:center;gap:10px;padding:14px 12px 0 20px}
.g-top b{font-size:15px;font-weight:600}
.g-top span{margin-left:auto;font-size:12.5px;color:var(--muted)}
.g-bar{height:4px;margin:12px 20px 0;border-radius:4px;background:var(--line-2);overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--ok);transition:width .4s ease-out}
.g-body{padding:20px;display:grid;gap:14px}
.g-body h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
.g-late{font:600 30px var(--f);letter-spacing:-.03em;color:var(--late);line-height:1.1}
.g-late small{display:block;font:400 13px var(--f);letter-spacing:0;color:var(--muted);margin-top:4px}
.g-acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:0 20px 14px}
.g-acts .mv{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:58px}
.g-acts .mv span{display:flex;align-items:center;gap:7px}
.g-foot{margin:0;padding:0 20px 16px;font-size:12px;color:var(--faint)}
.g-done{padding:34px 24px 26px;display:grid;gap:10px;justify-items:center;text-align:center}
.g-done h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.g-done p{margin:0;color:var(--muted)}
.g-done .f-acts{margin-top:8px}
@media (max-width:600px){.g-acts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.g-card{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.6}}}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(30px);opacity:.5}}}

<script>
const SERVER = "monday.com";
const BOARD = 2472462203;
const BOARD_URL = "https://poddsterstudios-team.monday.com/boards/" + BOARD;
const COLS = ["status","person","date","date4","date_mkx87nb3","dup__of_1st_cut_deadline","status_1","board_relation_mkxb8cpz","link_mm22fna1","link_mkxbtnjf","link_mkxbm8as","numeric_mm1y5e6b","date_mm02j5tr"];
const INPUT = { boardId: BOARD, includeColumns: true, includeGroup: false, columnIds: COLS, limit: 500,
  filters: [{ columnId: "people", compareValue: ["assigned_to_me"], operator: "any_of" }] };
const FLOW = ["Queue","Assigned","In Process","In Review","Corrections","Client Review"];
const COLOR = { "Queue": "--st-queue", "Assigned": "--st-assigned", "In Process": "--st-process", "In Review": "--st-review", "Corrections": "--st-corr", "Client Review": "--st-client", "Done": "--st-done" };
const CLOSED = new Set(["Done","Cancelled","No Client Response","Paid"]);
const IN_EDIT = new Set(["Queue","Assigned","In Process","In Review","Corrections"]);
const MOVE_TO = ["Assigned","In Process","In Review","Corrections","Client Review","Done"];
const CORPORATE = /dmitrii|suvo|enbd/i;
const EDITOR_IDS = { igor:"43400381", stipe:"61381904", georges:"36795459", stefan:"38981225", akssat:"88817643",
  glody:"60723690", shrijit:"101677796", motasem:"107518052", mahmoud:"107176166", bashar:"103717656", ajin:"71556126" };

const ME_ID = 49670201, CLIENTS_BOARD = 18330033684;
const EDITORS = [["Igor Garčev",43400381],["Motasem Jammal",107518052],["Stipe Majić",61381904],["Georges Saliba",36795459],["Stefan Mikić",38981225],["Akssat",88817643],["Mahmoud",107176166],["Glody Kikonga",60723690],["Shrijit Chowdhury",101677796],["Bashar M. Najjar",103717656],["Ajin",71556126]];
const KINDS = [["Episode",""],["Highlights"," (Highlights)"],["Reel"," Reel"],["Teaser"," (Teaser)"]];
let mcp = null;
/* IDs this page wrote recently, so a refresh doesn't report our own changes back as live activity. */
const WROTE = new Map();
const markWrote = id => WROTE.set(String(id), Date.now());
const wroteRecently = id => Date.now() - (WROTE.get(String(id)) || 0) < 120000;
const S = { items: [], storedAt: null, error: null, loading: true, q: "", editor: null, sel: null, busy: false, draft: "", corr: true, mention: true, drag: null, dropZone: null };
try { S.names = localStorage.getItem("river.names") === "urgent" ? "urgent" : "all"; } catch (_) { S.names = "all"; }

const str = v => typeof v === "string" ? v : "";
const isoDate = v => /^\d{4}-\d{2}-\d{2}$/.test(str(v)) ? v : null;
const lastUrl = v => { const m = str(v).match(/https?:\/\/[^\s]+/g); return m ? m[m.length - 1] : null; };
const clientName = v => Array.isArray(v) && v[0] && v[0].name ? v[0].name.replace(/^(AG|BL)\s*-\s*/i, "").trim() : "";
function norm(raw) {
  const c = raw.column_values || {};
  return { id: String(raw.id), name: raw.name || "Untitled", url: raw.url || BOARD_URL, updated: raw.updated_at, created: raw.created_at,
    stage: str(c.status) || "No status", editor: str(c.person), available: isoDate(c.date), draft: isoDate(c.date4),
    v1: isoDate(c.date_mkx87nb3), final: isoDate(c.dup__of_1st_cut_deadline), publishing: isoDate(c.date_mm02j5tr), invoice: str(c.status_1),
    client: clientName(c.board_relation_mkxb8cpz), upload: lastUrl(c.link_mm22fna1), share: lastUrl(c.link_mkxbtnjf),
    dropbox: lastUrl(c.link_mkxbm8as), units: parseFloat(str(c.numeric_mm1y5e6b)) || 0 };
}
const isoOf = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayISO = () => isoOf(new Date());
const dayNum = iso => Math.round(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5);
const T = () => dayNum(todayISO());
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const short = iso => iso ? (+iso.slice(8, 10)) + " " + MON[+iso.slice(5, 7) - 1] : "Not set";
const DATE_COLS = [["available","date","Available"],["draft","date4","Draft"],["v1","date_mkx87nb3","V1"],["final","dup__of_1st_cut_deadline","Final"],["publishing","date_mm02j5tr","Publishing"]];
function addWorkdays(n) { const d = new Date(); while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n--; } return isoOf(d); }
const nextEmptyDate = it => DATE_COLS.find(([k]) => !it[k]) || null;
/* Corrections rule: moving to Corrections fills the next empty deadline column with today + 2 working days, in the same Monday write. */
function correctionsPatch(it) { const slot = nextEmptyDate(it); if (!slot) return { cv: {}, slot: null }; const iso = addWorkdays(2); return { cv: { [slot[1]]: { date: iso } }, slot, iso }; }
function nextDue(it) {
  if (!IN_EDIT.has(it.stage)) return null;
  if (it.stage === "Corrections") return [it.v1, it.final].filter(Boolean).sort().pop() || it.draft;
  return it.draft;
}
const daysTo = it => { const d = nextDue(it); return d ? dayNum(d) - T() : null; };
function ageDays(it) { const last = [it.draft, it.v1, it.final].filter(Boolean).sort().pop() || (it.updated || "").slice(0, 10); return last ? T() - dayNum(last) : 0; }
const isLate = it => it.stage === "Client Review" ? (!CORPORATE.test(it.name) && ageDays(it) > 7) : (daysTo(it) !== null && daysTo(it) < 0);
function rel(it) {
  if (it.stage === "Client Review") { const a = ageDays(it); return { cls: a > 7 && !CORPORATE.test(it.name) ? "late" : "", txt: a + (a === 1 ? " day" : " days") + " with the client" }; }
  const d = daysTo(it); if (d === null) return { cls: "", txt: "No deadline" };
  if (d < 0) return { cls: "late", txt: (-d) + (d === -1 ? " day late" : " days late") };
  if (d === 0) return { cls: "today", txt: "Due today" };
  return { cls: "", txt: d === 1 ? "Due tomorrow" : "Due in " + d + " days" };
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
const colorOf = st => "var(" + (COLOR[st] || "--st-other") + ")";
const firstName = n => ((n || "").split(", ")[0] || "").split(" ")[0];
const label = it => it.client || it.name.split(/\s[-:]\s/)[0];
const initials = n => { const p = (n || "").trim().split(/\s+/).filter(Boolean); return p.length ? (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase() : "–"; };
const AVC = ["#7C6CF2","#2F9E7E","#D2693C","#3B82C4","#B5487A","#8A8F2C","#5A7BD8","#C2410C","#0E8A9B","#9B59B6"];
const avColor = n => { let h = 0; for (const ch of n || "") h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AVC[h % AVC.length]; };
function seeded(id, k) { let h = 2166136261; const s = id + ":" + k; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }
const active = () => S.items.filter(i => !CLOSED.has(i.stage));
const inRiver = () => active().filter(i => FLOW.includes(i.stage));
const editorsOf = it => it.editor ? it.editor.split(", ") : [];
const shown = it => (!S.editor || editorsOf(it).includes(S.editor)) && (!S.q || (it.name + " " + it.client + " " + it.editor).toLowerCase().includes(S.q.toLowerCase()));

/* geometry */
const W = 1400, H = 520, MID = 262, X0 = 40, SEA = 1180, GATE_PAD = 26;
let GEO = null;
function geometry() {
  const groups = FLOW.map(st => inRiver().filter(i => i.stage === st));
  const maxN = Math.max(5, ...groups.map(g => g.length));
  const reach = (SEA - X0) / FLOW.length;
  const xs = FLOW.map((_, k) => X0 + reach * k);
  return { groups, reach, xs, centres: xs.map(x => x + reach / 2), half: groups.map(g => 34 + Math.sqrt(g.length / maxN) * 150), gates: xs.map(x => x + reach) };
}
function halfAt(x, G) {
  const pts = [[0, 26], ...G.centres.map((c, k) => [c, G.half[k]]), [SEA, 70], [W, 120]];
  for (let k = 1; k < pts.length; k++) if (x <= pts[k][0]) { const a = pts[k - 1], b = pts[k], t = (x - a[0]) / (b[0] - a[0] || 1), s = t * t * (3 - 2 * t); return a[1] + (b[1] - a[1]) * s; }
  return 120;
}
function edge(G, sign, from, to, step) { let d = ""; for (let x = from; step > 0 ? x <= to : x >= to; x += step) d += (d ? " L" : "M") + x + " " + (MID + sign * halfAt(x, G)).toFixed(1); return d; }
function zoneAt(x, G) { if (x >= SEA - 10) return "Done"; const k = Math.floor((x - X0) / G.reach); return FLOW[Math.max(0, Math.min(FLOW.length - 1, k))]; }
function place(it, k, G) {
  const x0 = G.xs[k] + 22, x1 = G.gates[k] - GATE_PAD;
  let t;
  if (it.stage === "Client Review") t = Math.min(ageDays(it), 21) / 21;
  else { const d = daysTo(it); t = d === null ? .08 : d < 0 ? 1 : Math.max(0, 1 - d / 14); }
  if (isLate(it)) t = 1;
  const x = x0 + t * (x1 - x0) - (isLate(it) ? seeded(it.id, 5) * 18 : 0);
  const h = halfAt(x, G) - 18;
  return { x, y: MID + (seeded(it.id, 2) * 2 - 1) * h * .92, r: 9 + Math.min(it.units || 1, 3) * 1.4 };
}
function relax(pts, G) {
  for (let iter = 0; iter < 40; iter++) for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
    const p = pts[a], q = pts[b], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || .01, min = p.r + q.r + 4;
    if (d < min) { const push = (min - d) / 2, ux = dx / d, uy = dy / d; p.y -= uy * push; q.y += uy * push; p.x -= ux * push * .3; q.x += ux * push * .3; }
  }
  pts.forEach(p => { const h = halfAt(p.x, G) - p.r - 6; p.y = Math.max(MID - h, Math.min(MID + h, p.y)); });
}

/* level + editors */
function weekStats() {
  const now = Date.now(), wk = 7 * 864e5, age = i => now - Date.parse(i.updated || 0);
  const done = S.items.filter(i => i.stage === "Done" && i.updated);
  const days = Array.from({ length: 14 }, (_, k) => { const d = new Date(); d.setDate(d.getDate() - 13 + k); const iso = isoOf(d); return done.filter(i => isoOf(new Date(i.updated)) === iso).length; });
  return { outThis: done.filter(i => age(i) < wk).length, outPrev: done.filter(i => age(i) >= wk && age(i) < 2 * wk).length,
    inThis: S.items.filter(i => i.created && now - Date.parse(i.created) < wk).length, days, late: inRiver().filter(isLate).length, open: inRiver().length };
}
function renderLevel() {
  const r = S.items.length > 0, w = weekStats(), net = w.inThis - w.outThis;
  const state = !r ? "" : net > 1 ? "rising" : net < -1 ? "draining" : "steady";
  const fill = r ? Math.max(8, Math.min(100, w.open / Math.max(w.open, 40) * 100)) : 0;
  $("level").innerHTML = `
    <div class="gauge"><div class="tube ${state === "rising" ? "rising" : ""}" aria-hidden="true"><i style="height:${fill.toFixed(0)}%"></i></div>
      <div><b class="${state}">${!r ? "Reading the river…" : state === "rising" ? "Water is rising" : state === "draining" ? "River is draining" : "Holding steady"}</b>
      <p>${!r ? "" : `${w.inThis} episode${w.inThis === 1 ? "" : "s"} flowed in this week and ${w.outThis} reached Done. ${state === "rising" ? "Push a few through to stop the backlog building." : state === "draining" ? "You're finishing more than is arriving." : "In and out are about even."}`}</p></div></div>
    <div class="stat"><span>Open in the river</span><b class="tnum">${r ? w.open : "–"}</b><small>across six stages</small></div>
    <div class="stat"><span>Pressing on a gate</span><b class="tnum ${w.late ? "bad" : ""}">${r ? w.late : "–"}</b><small>overdue, or client quiet 7+ days</small></div>
    <div class="stat"><span>Reached Done this week</span><b class="tnum ${r && w.outThis >= w.outPrev ? "good" : ""}">${r ? w.outThis : "–"}</b><small>${r ? w.outPrev + " the week before" : ""}</small></div>`;
}
const editorId = n => EDITOR_IDS[firstName(n).toLowerCase()] || null;
const fmtU = u => String(Math.round(u * 100) / 100);
/* Live load per editor: episodes and units in edit stages (Assigned to Corrections), plus Client Review. An episode with no Units counts as 1. */
function editorLoad() {
  const m = new Map(), at = n => m.get(n) || (m.set(n, { n: 0, u: 0, cr: 0 }), m.get(n));
  inRiver().forEach(i => editorsOf(i).forEach(e => { const x = at(e); if (IN_EDIT.has(i.stage)) { x.n++; x.u += i.units || 1; } else x.cr++; }));
  return m;
}
/* Every editor gets a chip, so you can drop an episode on someone who is free right now. */
function roster() {
  const load = editorLoad(), seen = new Set([...load.keys()].map(n => firstName(n).toLowerCase()));
  EDITORS.forEach(([n]) => { if (!seen.has(firstName(n).toLowerCase())) load.set(n, { n: 0, u: 0, cr: 0 }); });
  return [...load.entries()].sort((a, b) => (b[1].n - a[1].n) || (b[1].u - a[1].u) || (b[1].cr - a[1].cr) || a[0].localeCompare(b[0]));

function renderTribs() {
  if (!S.items.length) { $("tribs").innerHTML = ""; return; }
  const dragging = !!(S.drag && S.drag.moved);
  $("tribs").className = "tribs" + (dragging ? " drag" : "");
  $("tribs").innerHTML = `<span>Editors</span>` + roster().map(([n, l]) => { const id = editorId(n), busy = l.n + l.cr;
    const t = `${n}: ${l.n} in edit (${fmtU(l.u)} unit${l.u === 1 ? "" : "s"}), ${l.cr} with clients. Click to filter${id ? ", or drop an episode here to give it to " + firstName(n) : ""}.`;
    return `<button class="trib ${busy ? "" : "idle"} ${S.dropEditor === n ? "drop" : ""}" type="button" data-ed="${esc(n)}" ${id ? `data-eid="${id}"` : ""} aria-pressed="${S.editor === n}" title="${esc(t)}" aria-label="${esc(t)}"><span class="av" style="--ac:${avColor(n)}">${esc(initials(n))}</span>${esc(n.split(" ")[0])}<em>${l.n ? l.n + " · " + fmtU(l.u) + "u" : busy ? "0" : "free"}</em></button>`; }).join("");
}

/* river */
function renderRiver() {
  const svg = $("river");
  if (!S.items.length) { svg.innerHTML = `<text x="${W / 2}" y="${MID}" text-anchor="middle" class="st-hint">${S.error ? "Couldn't read your board." : "Reading your board…"}</text>`; return; }
  const G = geometry(); GEO = G;
  const w = weekStats();
  let h = `<defs>
      <linearGradient id="wG" x1="0" x2="1"><stop offset="0" stop-color="#3FA9FF" stop-opacity=".05"/><stop offset=".35" stop-color="#3FA9FF" stop-opacity=".16"/><stop offset=".85" stop-color="#6C7CFF" stop-opacity=".2"/><stop offset="1" stop-color="#9C8CFF" stop-opacity=".28"/></linearGradient>
      <radialGradient id="seaG" cx="1" cy=".5" r="1"><stop offset="0" stop-color="#9C8CFF" stop-opacity=".35"/><stop offset="1" stop-color="#9C8CFF" stop-opacity="0"/></radialGradient></defs>
    <rect x="${SEA - 30}" y="0" width="${W - SEA + 30}" height="${H}" fill="url(#seaG)"/>
    <path d="${edge(G, -1, 0, W, 10)} ${edge(G, 1, W, 0, -10).replace(/^M/, "L")} Z" fill="url(#wG)"/>
    <path class="bank" d="${edge(G, -1, 0, W, 10)}"/><path class="bank" d="${edge(G, 1, 0, W, 10)}"/>`;

    const k = e.target.closest("[data-kind]"); if (k) { S.form.kind = k.dataset.kind; if (!S.form.custom) S.form.name = autoName(S.form); renderForm(); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "close") closePanel(); else if (a.dataset.act === "create") createTask();
    return;
  }
  const it = S.items.find(i => i.id === S.sel); if (!it) return;
  const st = e.target.closest("[data-stage]"); if (st) { setStage(it, st.dataset.stage); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "close") closePanel(); else if (a.dataset.act === "post") postNote(); else if (a.dataset.act === "pkg-retry") loadPackage(it, true);
});
$("panel").addEventListener("input", e => {
  if (e.target.id === "note") S.draft = e.target.value;
  if (!S.adding || !S.form) return;
  const f = S.form, id = e.target.id;
  if (id === "f-name") { f.name = e.target.value; f.custom = true; const b = $("panel").querySelector('[data-act="create"]'); if (b) b.disabled = !f.name.trim(); return; }
  if (id === "f-units") { f.units = e.target.value; return; }
  if (id === "f-client") { f.client = e.target.value.trim(); const c = (S.clients || []).find(x => x.name.toLowerCase() === f.client.toLowerCase()); f.clientId = c ? c.id : null; if (c) f.client = c.name; }
  if (id === "f-date") f.date = e.target.value;
  if (!f.custom) { f.name = autoName(f); const n = $("f-name"); if (n) n.value = f.name; }
  const sum = $("panel").querySelector(".sum span"); if (sum && id === "f-client") sum.innerHTML = `Producer <b>you</b>${f.clientId ? `, linked to <b>${esc(f.client)}</b>` : f.client ? `, <span class="late">client not found on PP Clients Only, so it won't be linked</span>` : ""}`;
});
$("panel").addEventListener("change", e => { if (e.target.id === "corr") S.corr = e.target.checked; if (e.target.id === "mention") S.mention = e.target.checked; if (S.adding && e.target.id === "f-editor") { S.form.editor = e.target.value; renderForm(); } });
const GATE_KEYS = { c: "corr", r: "client", d: "done", n: "nudge", s: "skip", arrowright: "skip" };
document.addEventListener("keydown", e => {
  if (S.inbox && e.key === "Escape") { e.preventDefault(); closeInbox(); return; }
  if (S.gates) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { e.preventDefault(); closeGates(); return; }
    const k = GATE_KEYS[e.key.toLowerCase()], b = k && $("gates").querySelector(`[data-g="${k}"]`);
    if (b && !b.disabled) { e.preventDefault(); gateAct(k); }
    else if (e.key === "Enter" && !gateItem()) { e.preventDefault(); closeGates(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (typing) {
    if (e.target.id === "note" && (e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); postNote(); }
    if (e.key === "Enter" && S.adding && /^f-/.test(e.target.id) && e.target.id !== "f-client") { e.preventDefault(); createTask(); return; }
    if (e.key === "Escape" && S.adding) { closePanel(); return; }
    if (e.key === "Escape") { if (e.target.id === "q") { e.target.value = ""; S.q = ""; renderRiver(); renderPressing(); } e.target.blur(); }
    return;
  }
  if (e.key === "Escape") { if (S.drag) { S.drag = null; S.dropZone = null; S.dropEditor = null; tip.hidden = true; renderRiver(); renderTribs(); } else if (S.sel || S.adding) closePanel(); }
  else if ((e.key === "n" || e.key === "N") && !S.adding) { e.preventDefault(); openAdd(); }
  else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  else if ((e.key === "i" || e.key === "I") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); S.inbox ? closeInbox() : openInbox(); }
  else if ((e.key === "g" || e.key === "G") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openGates(); }
  else if (e.key === "r" || e.key === "R") sync();
});

/* data */
async function loadMore(cursor, acc, depth) {
  if (!cursor || depth > 3) return acc;
  try {
    const r = await mcp.callTool(SERVER, "get_board_items_page", { boardId: BOARD, includeColumns: true, includeGroup: false, columnIds: COLS, limit: 500, cursor }, { cache: { staleTime: 30000 } });
    const p = r.payload || {}; acc.push(...(p.items || []));
    return loadMore(p.pagination && p.pagination.has_more ? p.pagination.nextCursor : null, acc, depth + 1);
  } catch (e) { return acc; }
}
async function start() {
  setInterval(() => { renderSync(); renderLive(); }, 30000);
  render();
  try { mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { mcp = null; }
  if (!mcp) { S.loading = false; S.error = { code: "no_mcp" }; render(); return; }
  mcp.watchTool(SERVER, "get_board_items_page", INPUT, onBoard, { refetchInterval: 45000, cache: { staleTime: 30000 } });
  mcp.watchTool(SERVER, "all_api_read", { query: NOTIF_Q }, onNotifs, { refetchInterval: 60000, cache: { staleTime: 30000 } });
}
async function onBoard(ev) {
  if (ev.type === "error") {
    const c = ev.error && ev.error.code;
    if (["needs_reauth","server_not_connected","selection_required","not_in_manifest","not_granted","blocked_by_policy","approval_required","capability_disabled"].includes(c)) { S.items = []; S.seeded = false; }
    S.error = ev.error; S.loading = false; render(); return;
  }
  if (S.drag) return;
  const p = ev.result.payload || {};
  let raw = p.items || [];
  if (p.pagination && p.pagination.has_more) raw = await loadMore(p.pagination.nextCursor, raw.slice(), 1);
  const next = raw.map(norm), since = S.syncedAt || Date.now(), revalidating = !!(ev.result.cache && ev.result.cache.revalidating);
  /* No ripples on first load, or for a cached copy that is about to be replaced. */
  const found = S.seeded && !revalidating ? diffItems(S.items, next) : [];
  S.items = next;
  if (!revalidating) { S.seeded = true; S.syncedAt = Date.now(); }
  S.storedAt = ev.result.cache ? ev.result.cache.storedAt : Date.now();
  S.error = null; S.loading = revalidating;
  noteChanges(found, since);
  if (S.pendingOpen && S.items.some(i => i.id === S.pendingOpen) && !S.adding) { S.sel = S.pendingOpen; S.pendingOpen = null; }
  render();
}
start();
</script>
